system:
  mode: "mock" # "mock" or "edge"
  camera_id: "CAM_FRONT_GATE_01"

camera:
  source: 0
  resolution: [640, 480]

hardware:
  barrier_pin: 17
  led_pin: 22
  has_gps: false
  cellular_modem_port: "/dev/ttyUSB0"

access_control:
  face_match_threshold: 0.6 # Cosine similarity threshold for Smart Attendance
  authorized_plates:
    - "MH12AB1234"
    - "KA01XYZ999"
  unauthorized_attributes:
    - color: "black" # Example: Non hi-vis clothing in a safety zone
  # Intruder Detection Zone Masking (Feature 3)
  zones:
    Zone_A:
      polygon: [[0, 0], [320, 0], [320, 240], [0, 240]]
      restricted_hours: ["22:00", "06:00"] # 10 PM to 6 AM

storage:
  # Dual-Stream Capture (Feature 5)
  retention_days: 30
  stream_a_res: [640, 480]
  stream_b_res: [1920, 1080]

alerting:
  # Use a private broker for secure alerting. E.g. "your-private-broker.example.com"
  # Defaulting to localhost placeholder so public broker isn't used insecurely.
  mqtt_broker: "localhost" 
  mqtt_topic: "vision_os/alerts"
  mqtt_username: "admin"
  mqtt_password: "secure_password"
  mqtt_use_tls: false # set to true for production TLS
  mock_lat_lon: "37.7749,-122.4194" # Feature 12: Approximate Location
  cooldowns:
    attendance_sec: 300 # 5 minutes
    alert_sec: 60       # 1 minute
